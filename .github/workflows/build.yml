name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 从官方发行版内核包剥离 kernel + initramfs（本项目不编译任何内核）
  distro-kernel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ubuntu-x86_64, distro: ubuntu, arch: amd64 }
          - { name: ubuntu-arm64,  distro: ubuntu, arch: arm64 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: matrix.arch == 'arm64'
        run: sudo docker run --privileged --rm tonistiigi/binfmt --install arm64
      - run: |
          chmod +x scripts/extract-distro-kernel.sh
          bash scripts/extract-distro-kernel.sh ${{ matrix.distro }} out-${{ matrix.name }} ${{ matrix.arch }}
          mv out-${{ matrix.name }}/kernel kernel-${{ matrix.name }}
          mv out-${{ matrix.name }}/initrd initrd-${{ matrix.name }}
          cp out-${{ matrix.name }}/kernel-source.txt kernel-source-${{ matrix.name }}.txt
          ls -la kernel-* initrd-*
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.name }}
          path: |
            kernel-${{ matrix.name }}
            initrd-${{ matrix.name }}
            kernel-source-${{ matrix.name }}.txt

  kernel-archarm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libarchive-tools
          curl -fL --retry 3 -o ala.tar.gz http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz
          mkdir -p ala
          sudo bsdtar -xpf ala.tar.gz -C ala boot/Image boot/initramfs-linux.img 2>/dev/null || \
            bsdtar -xpf ala.tar.gz -C ala boot/Image boot/initramfs-linux.img
          cp ala/boot/Image kernel-arm64-ala
          cp ala/boot/initramfs-linux.img initrd-arm64-ala
          echo "linux-aarch64 (ArchLinuxARM official, from ALA tarball)" > kernel-source-arm64-ala.txt
          ls -la kernel-arm64-ala initrd-arm64-ala
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-archarm
          path: |
            kernel-arm64-ala
            initrd-arm64-ala
            kernel-source-arm64-ala.txt

  rootfs-ubuntu:
    strategy:
      matrix:
        debarch: [amd64, arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - if: matrix.debarch == 'arm64'
        run: sudo docker run --privileged --rm tonistiigi/binfmt --install arm64
      - run: |
          chmod +x scripts/build-rootfs-ubuntu-docker.sh
          a=${{ matrix.debarch }}
          [ "$a" = amd64 ] && a=x86_64 || a=arm64
          sudo -E bash scripts/build-rootfs-ubuntu-docker.sh "${{ matrix.debarch }}" "ubuntu-$a-rootfs.ext4" 1400
      - uses: actions/upload-artifact@v4
        with:
          name: rootfs-ubuntu-${{ matrix.debarch }}
          path: ubuntu-*rootfs.ext4

  rootfs-archarm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libarchive-tools
          chmod +x scripts/build-rootfs-archarm.sh
          sudo scripts/build-rootfs-archarm.sh archarm-rootfs.ext4 2600
      - uses: actions/upload-artifact@v4
        with:
          name: rootfs-archarm
          path: archarm-rootfs.ext4

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [distro-kernel, kernel-archarm, rootfs-ubuntu, rootfs-archarm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: compress + catalog
        run: |
          cd dist
          for f in *.ext4; do [ -f "$f" ] && gzip -9 "$f"; done
          cp ../catalog.json .
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
